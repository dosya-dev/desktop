appId: dev.dosya.desktop
productName: dosya
artifactName: "${productName}-${version}-${arch}.${ext}"
copyright: Copyright 2025 dosya.dev

directories:
  output: release
  buildResources: build

# Ship exactly the bundles. The renderer is fully bundled and the main
# process bundles its last runtime deps (see externalizeDepsPlugin exclude
# list), so node_modules has no business in the asar - it was 56 MB of dead
# weight and about to double when maplibre entered dependencies.
files:
  - "out/main/**/*"
  - "out/preload/**/*"
  - "out/renderer/**/*"
  - "build/*.png"
  - "!out/**/*.tsbuildinfo"
  # Source maps exist only on a release build that uploads them to Sentry
  # (electron.vite.config.ts deletes them after upload); this keeps a failed
  # upload from shipping the app's full source inside the asar.
  - "!out/**/*.map"
  - "!out/src/**"
  - "!out/apps/**"
  - "!out/packages/**"
  - "!out/electron.vite.config.*"

# Close the packaged binary's generic-Node-runtime and tamper surfaces.
# enableCookieEncryption invalidates existing session cookies once: users
# re-login on first launch after this ships.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

# Disable auto-update publish - we upload to R2 via our own API
publish: []

# ── macOS ───────────────────────────────────────────────────────────
# Two targets: the .dmg is the human download (drag-to-Applications), the
# .zip is what electron-updater installs in place (it cannot update from a
# .dmg). Both are built from the same signed .app in one pass, so notarizing
# the .dmg registers the identical .app the .zip carries. See the update feed
# wiring in apps/api (renderLatestYaml points mac at the .zip).
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# dmg-background.tiff carries both @1x (540x380) and @2x (1080x760) reps,
# combined with `tiffutil -cathidpicheck`. dmg-builder sizes the Finder
# window from the background file itself (via `sips`, which reads the @1x
# rep of a HiDPI tiff) - dmg.window is only honored for the flat-color
# fallback, not here, so it's intentionally omitted. iconSize/x/y were
# verified against the art with a real dmgbuild run: x/y is each icon's
# center, and Finder draws the filename label itself below it - the
# background only reserves the space and never contains that text.
dmg:
  background: build/dmg-background.tiff
  iconSize: 128
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ─────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  icon: build/icon.png
  # electron-builder 26 moved signtool options out of `win` (leaving the old
  # key a schema error that fails all three platform builds, not just Windows).
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

# ── Microsoft Store (MSIX/AppX) ────────────────────────────────────
# Do NOT sign this target. Microsoft re-signs Store packages, and a package
# we signed ourselves is rejected on upload.
appx:
  # These three are copied verbatim from Partner Center > Product management >
  # Product identity. They are not ours to choose: any drift, including case,
  # fails the Store upload with an identity mismatch. identityName is issued
  # per product, so it changes if the product is ever recreated.
  identityName: "DOSYA.dosyaCloudStorageandFileSync"
  publisher: "CN=BEC0775D-6155-4622-BFBE-ABEBBF38FA5E"
  publisherDisplayName: "DOSYA"
  # Start menu, taskbar, Apps list and tile - NOT the Store listing, which uses
  # the reserved product name "dosya: Cloud Storage and File Sync" instead. That
  # title is 34 characters and truncates in every one of those Windows surfaces,
  # so the short form is deliberate. Both names are reserved in Partner Center.
  #
  # Also note this string lands in AppxManifest.xml through a raw regex
  # substitution with no XML escaping (app-builder-lib AppxTarget.js), so an
  # unescaped "&" here would produce a malformed manifest and fail makeappx.
  displayName: "dosya"
  # Forms part of the AUMID. Changing it after the first Store release breaks
  # taskbar pinning and notification identity for everyone already installed.
  # Charset is letters, digits and dots only - no spaces, colons or hyphens.
  applicationId: "dosya"
  backgroundColor: "#f9f8f6"
  # electron-builder defaults x64 to MinVersion 10.0.14316.0 - a pre-release
  # 1607 build, older than 1607's own RTM. Electron 23+ dropped everything
  # below Windows 10, so the default advertises a floor this app cannot
  # actually run on, and the Store would happily install it there. 17763 is
  # Windows 10 1809 / LTSC 2019, the oldest build still worth supporting.
  minVersion: "10.0.17763.0"
  languages:
    - en-US

# ── Linux ───────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: snap
      arch:
        - x64
  icon: build/icon.png
  category: Utility
  synopsis: Cloud storage and file sync for dosya.dev
  # electron-builder 26 derives the default from the scoped npm package name
  # ("@dosya-dev/desktop" -> "@dosya-devdesktop") and then rejects the "@".
  # Pin the name v25 used (productName), which is also the binary existing
  # AppImage/deb installs already have on disk. It is ALSO the snap's name
  # (SnapCoreLegacy lowercases executableName), which must match the name
  # registered on the Snap Store and SNAP_NAME in src/main/distribution.ts.
  executableName: dosya

# ── Snap Store ─────────────────────────────────────────────────────
# Built from electron-builder's prebuilt Electron snap template with
# mksquashfs, so the Linux runner needs no snapcraft/LXD to BUILD it; the
# release workflow installs snapcraft only to upload. Two things silently
# switch the template off and make the build shell out to snapcraft instead:
# a non-default `stagePackages` list or any `buildPackages`. Plugs do not (the
# template check in coreLegacy.js only looks at those two), so the extras
# below are safe to add.
#
# The template also drops chrome-sandbox and appends --no-sandbox to the app
# command: in strict confinement Chromium's own sandbox cannot start (it
# needs user namespaces snapd's AppArmor profile denies), and snapd's
# confinement replaces it.
snap:
  # Ubuntu 22.04 runtime; Electron's Linux builds want glibc 2.35+.
  base: core22
  confinement: strict
  grade: stable
  title: dosya
  summary: Cloud storage and file sync for dosya.dev
  plugs:
    - default
    # Sync folders on other drives and USB media. Not auto-connected: users
    # run `sudo snap connect dosya:removable-media` (documented on /desktop).
    - removable-media
    # Electron's safeStorage (the encrypted session cookie, see the
    # enableCookieEncryption fuse above) talks to the keyring over D-Bus; the
    # `default` set does not include the interface, so without it snapd blocks
    # the call and safeStorage falls back to an unencrypted backend.
    - password-manager-service
    # LAN transfer listens for peers.
    - network-bind

# ── Installer options ──────────────────────────────────────────────
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Uninstall removes %APPDATA%/dosya too: the session cookie, the sync index
  # and the sync config. Without this a reinstall on a shared or resold
  # machine came up already signed in to the previous owner's account (field
  # report 2026-09-02, desktop #15). Sync folders on disk are never touched.
  deleteAppDataOnUninstall: true
  # Registers the dosya:// URL scheme in the Windows registry. `protocols:`
  # below does NOT do this - electron-builder only feeds that block to the
  # macOS, Linux and AppX packagers, so the NSIS build shipped with the scheme
  # unregistered and the desktop OAuth callback had nowhere to land.
  include: build/installer.nsh

# ── Protocol registration ──────────────────────────────────────────
# macOS (CFBundleURLTypes), Linux (.desktop MimeType) and AppX (uriSchemes)
# only. Windows/NSIS is handled by nsis.include above plus the runtime
# setAsDefaultProtocolClient call in src/main/index.ts.
protocols:
  - name: dosya
    schemes:
      - dosya
