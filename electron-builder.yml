appId: dev.dosya.desktop
productName: dosya
artifactName: "${productName}-${version}-${arch}.${ext}"
copyright: Copyright 2025 dosya.dev

directories:
  output: release
  buildResources: build

files:
  - "out/**/*"
  - "build/*.png"
  - "node_modules/**/*"
  - "!node_modules/*/{test,tests,__tests__,__mocks__,.github}/**"
  - "!node_modules/*/{CHANGELOG,README,readme,changelog}*"
  - "!node_modules/**/*.{ts,map,md}"
  - "!node_modules/**/{.eslintrc,.prettier*,tsconfig}*"

# Disable auto-update publish - we upload to R2 via our own API
publish: []

# ── macOS ───────────────────────────────────────────────────────────
# Two targets: the .dmg is the human download (drag-to-Applications), the
# .zip is what electron-updater installs in place (it cannot update from a
# .dmg). Both are built from the same signed .app in one pass, so notarizing
# the .dmg registers the identical .app the .zip carries. See the update feed
# wiring in apps/api (renderLatestYaml points mac at the .zip).
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# ── Mac App Store ───────────────────────────────────────────────────
# Sandboxed sibling of the `mac` target above, built from the same source.
# hardenedRuntime is a Developer ID concept and must stay OFF here - MAS uses
# the App Sandbox instead. The app disables its Quick Action, its updater and
# its billing link at runtime via process.mas (see src/main/mas.ts).
mas:
  target:
    - target: pkg
      arch:
        - universal
  category: public.app-category.productivity
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/dosya-mas.provisionprofile
  extendInfo:
    # Only HTTPS, which is exempt. Declaring it here avoids answering the
    # export-compliance question on every upload.
    ITSAppUsesNonExemptEncryption: false

# ── Mac App Store, local test build ────────────────────────────────
# A store-signed .pkg CANNOT be installed and launched locally: its
# distribution provisioning profile is only valid for App Store delivery, so
# the app crashes on launch. Sandbox behaviour has to be verified either
# through macOS TestFlight or with this development-signed build, which
# inherits every mas setting except the profile and signing type.
masDev:
  type: development
  provisioningProfile: build/dosya-mas-dev.provisionprofile

# ── Windows ─────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  icon: build/icon.png
  signingHashAlgorithms:
    - sha256

# ── Microsoft Store (MSIX/AppX) ────────────────────────────────────
appx:
  identityName: "dosya.dev.dosya.dev"
  displayName: "dosya.dev"
  publisher: "CN=9C40EE20-FDD6-4D45-BE36-45A257E76FCA"
  publisherDisplayName: "dosya.dev"
  applicationId: "dosya"
  backgroundColor: "#f9f8f6"
  languages:
    - en-US

# ── Linux ───────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Utility

# ── Installer options ──────────────────────────────────────────────
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# ── Protocol registration ──────────────────────────────────────────
protocols:
  - name: dosya
    schemes:
      - dosya
